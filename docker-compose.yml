services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doai
      POSTGRES_PASSWORD: doai_local
      POSTGRES_DB: doai
    ports:
      - "5432:5432"
    volumes:
      - vol-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doai -d doai"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doai
      POSTGRES_PASSWORD: doai_local
      POSTGRES_DB: doai_test
    ports:
      - "5433:5432"
    volumes:
      - vol-postgres-test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doai -d doai_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    restart: unless-stopped
    build:
      context: .
      args:
        NODE_ENV: production
    env_file:
      - .env
    environment:
      # Dentro da rede do Compose, o host do banco é o nome do serviço.
      DATABASE_URL: postgresql://doai:doai_local@postgres:5432/doai?schema=public
      NODE_ENV: production
    ports:
      - "${API_HOST_PORT:-7340}:7340"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate:deploy && npm start"]

volumes:
  vol-postgres:
  vol-postgres-test:
